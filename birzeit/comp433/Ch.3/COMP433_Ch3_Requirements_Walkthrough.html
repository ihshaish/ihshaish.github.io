<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirements engineering: interactive walkthrough · COMP433 · Chapter 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f1419;
    --ink-soft: #2c3540;
    --ink-mute: #5a6473;
    --paper: #faf7f2;
    --paper-warm: #f3ede2;
    --paper-deep: #ebe2d1;
    --accent: #b85c38;
    --accent-deep: #7a3a23;
    --accent-soft: rgba(184,92,56,0.08);
    --steel: #2c5f7c;
    --steel-soft: #d6e0e8;
    --steel-deep: #1a3d52;
    --moss: #4a6b3a;
    --moss-soft: #e0e8d8;
    --gold: #c9a961;
    --rule: #d8cfc0;
    --rule-strong: #c5b9a3;
    --rule-soft: #ebe2d1;
    --danger: #b85c38;
    --muted: #6b7280;
    --faint: #94a3b8;
    --shadow: 0 1px 0 rgba(15,20,25,0.04), 0 8px 24px rgba(15,20,25,0.06);
    --shadow-lg: 0 4px 12px rgba(15,20,25,0.08), 0 24px 48px rgba(15,20,25,0.10);
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter Tight', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    font-size: 16px;
    background-image:
      radial-gradient(circle at 15% 5%, rgba(184,92,56,0.05) 0%, transparent 35%),
      radial-gradient(circle at 85% 85%, rgba(44,95,124,0.05) 0%, transparent 35%);
    min-height: 100vh;
  }

  .ribbon { position: sticky; top: 0; z-index: 100; background: rgba(250,247,242,0.95); backdrop-filter: blur(14px); border-bottom: 1px solid var(--rule); padding: 14px 0; }
  .ribbon-inner { max-width: 1200px; margin: 0 auto; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .brand { font-family: var(--serif); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 5px; background: linear-gradient(135deg, var(--steel) 0%, var(--accent) 100%); box-shadow: 0 2px 6px rgba(184,92,56,0.25); }
  .ribbon-links { display: flex; gap: 4px; }
  .ribbon-links a { color: var(--ink-soft); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 11px; border-radius: 999px; transition: all 0.15s; }
  .ribbon-links a:hover { background: var(--paper-warm); color: var(--ink); }

  .page { max-width: 1200px; margin: 0 auto; padding: 36px 28px 80px; }

  /* Progress indicator */
  .progress { margin: 0 0 36px; }
  .progress-inner { display: flex; gap: 6px; flex-wrap: wrap; padding: 14px 18px; background: white; border: 1px solid var(--rule); border-radius: 999px; box-shadow: var(--shadow); }
  .progress .dot { flex: 1; min-width: 110px; padding: 8px 10px; border-radius: 999px; font-size: 12px; color: var(--muted); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
  .progress .dot:hover { background: var(--paper-warm); }
  .progress .dot.active { background: var(--ink); color: var(--paper); }
  .progress .dot.done { color: var(--steel-deep); }
  .progress .dot.done::before { content: '✓'; color: var(--moss); font-weight: 700; }
  .progress .roman { font-family: var(--serif); font-style: italic; font-size: 13px; opacity: 0.7; margin-right: 2px; }

  /* Hero masthead (intro only) */
  .masthead { padding: 40px 0 0; }
  .masthead .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; display: flex; align-items: center; gap: 14px; }
  .masthead .kicker::before { content: ''; flex-shrink: 0; width: 32px; height: 1px; background: var(--accent); }
  .masthead .kicker::after { content: ''; flex: 1; max-width: 120px; height: 1px; background: var(--accent); }
  .masthead h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(40px, 6.4vw, 74px); line-height: 1.02; letter-spacing: -0.03em; margin-bottom: 22px; font-variation-settings: "opsz" 144; max-width: 1100px; }
  .masthead h1 em { font-style: italic; color: var(--accent); font-variation-settings: "opsz" 144, "wght" 400; }
  .masthead .lede { font-size: 19px; max-width: 780px; color: var(--ink-soft); font-family: var(--serif); }
  .masthead .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 22px; margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--rule); }
  .masthead .meta-item { font-size: 13px; }
  .masthead .meta-item span:first-child { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 4px; }
  .masthead .meta-item span:last-child { font-weight: 600; color: var(--ink); }

  /* Step content */
  .sect-head { margin: 36px 0 26px; }
  .sect-head .num { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--accent); }
  .sect-head .kicker { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--steel); margin-left: 12px; }
  .sect-head h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(28px, 4.4vw, 48px); letter-spacing: -0.025em; line-height: 1.04; margin-top: 14px; margin-bottom: 14px; font-variation-settings: "opsz" 144; }
  .sect-head h2 em { font-style: italic; color: var(--accent); }
  .sect-head .lede { font-size: 17px; color: var(--ink-soft); max-width: 800px; font-family: var(--serif); }

  .prose { max-width: 980px; }
  .prose h3 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 32px 0 12px; letter-spacing: -0.015em; }
  .prose h4 { font-family: var(--serif); font-weight: 600; font-size: 17px; margin: 22px 0 8px; letter-spacing: -0.01em; }
  .prose p { font-size: 15.5px; color: var(--ink-soft); margin-bottom: 12px; line-height: 1.65; }
  .prose p strong { color: var(--ink); }
  .prose ul, .prose ol { font-size: 15.5px; color: var(--ink-soft); margin: 10px 0 16px 22px; line-height: 1.6; }
  .prose ul li, .prose ol li { margin-bottom: 6px; }
  .prose ul li strong, .prose ol li strong { color: var(--ink); }
  .prose a { color: var(--accent-deep); border-bottom: 1px dotted; text-decoration: none; }
  .prose a:hover { border-bottom-style: solid; }

  /* Term tooltip — anchored left, extends rightward, never clipped on the left margin */
  .term { position: relative; border-bottom: 1px dotted var(--accent); cursor: help; color: var(--ink); }
  .term .tip { position: absolute; bottom: calc(100% + 6px); left: 0; background: var(--ink); color: var(--paper); padding: 9px 13px; border-radius: 6px; font-size: 12.5px; line-height: 1.45; width: max-content; max-width: min(360px, calc(100vw - 80px)); opacity: 0; pointer-events: none; transition: opacity 0.15s; font-family: var(--sans); font-weight: 400; z-index: 60; box-shadow: 0 6px 20px rgba(15,20,25,0.18); white-space: normal; }
  .term .tip::after { content: ''; position: absolute; top: 100%; left: 16px; border: 6px solid transparent; border-top-color: var(--ink); }
  .term .tip .ar { display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.2); font-family: 'Amiri', 'Noto Naskh Arabic', serif; font-size: 14px; color: var(--gold); direction: rtl; text-align: right; }
  .term:hover .tip { opacity: 1; }
  /* If the term is too close to the right edge, the tooltip flips to right-anchored via this class — apply with JS or :nth-of-type heuristics if needed. */

  /* Callouts */
  .callout { padding: 18px 22px; border-radius: 8px; margin: 18px 0; max-width: 980px; }
  .callout .lbl { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
  .callout p { font-size: 14.5px; line-height: 1.6; margin: 0 0 8px; }
  .callout p:last-child { margin-bottom: 0; }
  .callout.note { background: var(--steel-soft); border-left: 4px solid var(--steel); color: var(--steel-deep); }
  .callout.note .lbl { color: var(--steel-deep); }
  .callout.warn { background: rgba(184,92,56,0.08); border-left: 4px solid var(--accent); color: var(--accent-deep); }
  .callout.warn .lbl { color: var(--accent-deep); }
  .callout.aside { background: var(--paper-warm); border-left: 4px solid var(--gold); color: var(--ink-soft); }
  .callout.aside .lbl { color: #b8860b; }

  /* Quote box */
  .quotebox { background: var(--paper-warm); border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; padding: 20px 26px; margin: 20px 0; max-width: 880px; }
  .quotebox p { font-family: var(--serif); font-size: 16px; font-style: italic; color: var(--ink-soft); line-height: 1.55; margin: 0; }
  .quotebox .source { display: block; margin-top: 8px; font-style: normal; font-size: 12.5px; font-family: var(--sans); color: var(--ink-mute); }

  /* Tables */
  .body-table-card { background: white; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); margin: 18px 0; max-width: 1080px; }
  .body-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .body-table th { background: var(--paper-warm); padding: 12px 16px; text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); font-weight: 600; border-bottom: 1px solid var(--rule); }
  .body-table td { padding: 12px 16px; border-bottom: 1px solid var(--rule-soft); color: var(--ink-soft); vertical-align: top; line-height: 1.55; }
  .body-table tr:last-child td { border-bottom: none; }
  .body-table td:first-child { font-weight: 600; color: var(--ink); white-space: nowrap; }

  /* Two-column callout pair */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 1080px; margin: 18px 0; }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }
  .two-col > div { background: white; border: 1px solid var(--rule); border-radius: 10px; padding: 18px 22px; }
  .two-col h4 { font-family: var(--serif); font-size: 16px; margin: 0 0 8px; color: var(--ink); }
  .two-col p { font-size: 14px; color: var(--ink-soft); line-height: 1.55; margin: 0; }
  .two-col ul { font-size: 14px; color: var(--ink-soft); margin: 6px 0 0 18px; line-height: 1.55; }

  /* Three-col cards */
  .three-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; max-width: 1080px; margin: 18px 0; }
  .three-col > div { background: white; border: 1px solid var(--rule); border-radius: 10px; padding: 18px 22px; }
  .three-col h4 { font-family: var(--serif); font-size: 16px; margin: 0 0 8px; color: var(--ink); }
  .three-col h4 .iconbox { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; background: var(--paper-warm); margin-right: 8px; font-family: var(--serif); font-style: italic; color: var(--accent); font-size: 14px; }
  .three-col p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; margin: 0; }
  .three-col ul { font-size: 13.5px; color: var(--ink-soft); margin: 6px 0 0 18px; }

  /* Worked-example requirement display */
  .req-card { background: white; border: 1px solid var(--rule); border-left: 4px solid var(--steel); border-radius: 6px; padding: 14px 18px; margin: 10px 0; max-width: 1080px; font-family: var(--mono); font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; }
  .req-card.system { border-left-color: var(--moss); }
  .req-card .id { color: var(--accent); font-weight: 600; }

  /* Pitfalls/checklist style */
  .checklist { margin: 14px 0; max-width: 1080px; }
  .checklist-item { display: flex; gap: 14px; padding: 12px 16px; background: white; border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 8px; }
  .checklist-item .check-num { font-family: var(--mono); font-weight: 700; color: var(--accent); font-size: 13px; flex-shrink: 0; }
  .checklist-item .check-body { font-size: 14px; color: var(--ink-soft); }
  .checklist-item .check-body strong { color: var(--ink); }

  /* === Interactive elements === */

  /* Drag-classify zone */
  .classify-zone { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin: 18px 0; max-width: 1080px; }
  @media (max-width: 800px) { .classify-zone { grid-template-columns: 1fr; } }
  .classify-bucket { background: white; border: 2px dashed var(--rule); border-radius: 10px; padding: 16px; min-height: 200px; transition: all 0.15s; }
  .classify-bucket.drop-hover { background: var(--paper-warm); border-color: var(--accent); }
  .classify-bucket .bucket-head { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .classify-bucket .bucket-head .hint { display: block; font-weight: 400; font-size: 10px; color: var(--muted); margin-top: 3px; letter-spacing: 0.06em; text-transform: none; }

  .classify-pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; background: var(--paper-warm); border-radius: 10px; margin: 14px 0; max-width: 1080px; min-height: 80px; }
  .classify-item { background: white; padding: 8px 14px; border-radius: 999px; font-size: 13.5px; color: var(--ink); border: 1px solid var(--rule); cursor: grab; transition: all 0.15s; user-select: none; }
  .classify-item:hover { box-shadow: var(--shadow); border-color: var(--accent); }
  .classify-item.dragging { opacity: 0.5; }
  .classify-item.placed-correct { background: var(--moss-soft); border-color: var(--moss); }
  .classify-item.placed-wrong { background: rgba(184,92,56,0.12); border-color: var(--accent); }

  .classify-feedback { margin-top: 12px; font-family: var(--mono); font-size: 12px; color: var(--ink-mute); }
  .classify-feedback .score { color: var(--accent); font-weight: 700; }

  /* Pick-one selection cards */
  .pickone { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; max-width: 1080px; margin: 16px 0; }
  .pickone-card { background: white; border: 2px solid var(--rule); border-radius: 10px; padding: 18px 20px; cursor: pointer; transition: all 0.15s; }
  .pickone-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .pickone-card.selected { background: var(--steel-soft); border-color: var(--steel); }
  .pickone-card.correct { background: var(--moss-soft); border-color: var(--moss); }
  .pickone-card.wrong { background: rgba(184,92,56,0.12); border-color: var(--accent); opacity: 0.7; }
  .pickone-card h5 { font-family: var(--serif); font-size: 16px; margin-bottom: 6px; color: var(--ink); }
  .pickone-card p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin: 0; }

  /* Multi-check (validation) */
  .multicheck-card { background: white; border: 1px solid var(--rule); border-radius: 10px; padding: 16px 20px; margin: 12px 0; max-width: 1080px; }
  .multicheck-card .req { font-family: var(--mono); font-size: 13.5px; color: var(--ink); padding: 10px 14px; background: var(--paper-warm); border-radius: 6px; margin-bottom: 12px; line-height: 1.55; }
  .multicheck-card .req .id { color: var(--accent); font-weight: 600; }
  .multicheck-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .multicheck-options label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: white; border: 1px solid var(--rule); border-radius: 999px; font-size: 12.5px; color: var(--ink-soft); cursor: pointer; transition: all 0.12s; }
  .multicheck-options label:hover { border-color: var(--accent); }
  .multicheck-options input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
  .multicheck-options label.checked { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }
  .multicheck-actions { display: flex; gap: 12px; margin-top: 12px; align-items: center; }
  .multicheck-feedback { font-size: 13px; color: var(--ink-mute); }
  .multicheck-feedback.right { color: var(--moss); }
  .multicheck-feedback.wrong { color: var(--accent); }

  /* Buttons */
  button { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; padding: 9px 16px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; transition: all 0.15s; }
  button.primary { background: var(--steel); color: white; border-color: var(--steel); }
  button.primary:hover { background: var(--steel-deep); border-color: var(--steel-deep); }
  button.secondary { background: white; color: var(--ink); border-color: var(--rule); }
  button.secondary:hover { background: var(--paper-warm); }
  button.ghost { background: transparent; color: var(--ink-soft); border-color: transparent; padding: 9px 12px; }
  button.ghost:hover { background: var(--paper-warm); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin: 40px 0 18px; padding: 18px 0; border-top: 1px solid var(--rule); }
  .nav-row .next-hint { font-size: 13px; color: var(--ink-mute); font-style: italic; }

  /* Stakeholder selector */
  .stakeholder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; max-width: 1080px; margin: 16px 0; }
  .stakeholder-card { background: white; border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; cursor: pointer; transition: all 0.15s; }
  .stakeholder-card:hover { box-shadow: var(--shadow); border-color: var(--accent); }
  .stakeholder-card.active { background: var(--steel-soft); border-color: var(--steel); border-width: 2px; padding: 13px 15px; }
  .stakeholder-card .role { font-family: var(--serif); font-weight: 600; font-size: 16px; color: var(--ink); margin-bottom: 4px; }
  .stakeholder-card .stake { font-size: 12px; color: var(--ink-mute); }

  /* Process steps visualisation */
  .process-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 18px 0; max-width: 1080px; }
  .process-step { background: white; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; font-size: 13px; color: var(--ink); cursor: grab; user-select: none; }
  .process-step .step-num { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-right: 6px; }
  .process-arrow { color: var(--muted); font-size: 18px; }

  /* Effort estimation calculator (reused from earlier) */
  .calc-card { background: white; border: 2px solid var(--steel); border-radius: 12px; padding: 22px 26px; margin: 18px 0; max-width: 1080px; box-shadow: var(--shadow-lg); }
  .calc-card h4 { font-family: var(--serif); font-size: 20px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.015em; color: var(--steel-deep); }
  .calc-card .sub { font-size: 13.5px; color: var(--ink-mute); margin-bottom: 16px; }
  .calc-table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 14px; }
  .calc-table thead th { background: var(--paper-warm); padding: 9px 11px; text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); font-weight: 600; border-bottom: 1px solid var(--rule); }
  .calc-table tbody td { padding: 7px 11px; border-bottom: 1px solid var(--rule-soft); color: var(--ink-soft); }
  .calc-table input[type="text"], .calc-table input[type="number"] { width: 100%; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px; font-family: var(--sans); font-size: 13.5px; color: var(--ink); background: var(--paper); }
  .calc-table input:focus { outline: none; border-color: var(--accent); background: white; }
  .calc-table input[readonly] { background: var(--paper-warm); color: var(--ink); font-weight: 600; cursor: default; }
  .calc-table input.totalcol { background: var(--steel-soft); color: var(--steel-deep); font-weight: 700; }
  .calc-table .x-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 16px; padding: 0 4px; }
  .calc-actions { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .calc-params { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 18px; padding: 14px; background: var(--paper-warm); border-radius: 8px; margin-bottom: 16px; }
  .calc-params label { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 3px; font-weight: 600; }
  .calc-params input { width: 100%; padding: 6px 9px; border: 1px solid var(--rule); border-radius: 5px; font-family: var(--sans); font-size: 13.5px; color: var(--ink); background: white; }
  .calc-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding: 18px; background: var(--ink); border-radius: 10px; }
  .calc-summary .metric { font-size: 13px; }
  .calc-summary .metric .lbl { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; font-weight: 600; }
  .calc-summary .metric .val { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--paper); letter-spacing: -0.01em; }

  COMP433 · Requirements engineering walkthrough · <a href="/birzeit/comp433/">course page</a> · <a href="/birzeit/comp433/Ch.3/COMP433_Ch3_Requirements_Engineering_Companion.html">handbook</a>
</footer>

</div>

<script>
/* ========================================================================
   STATE
======================================================================== */

const STEPS = [
  { id: "intro",        num: "i",    label: "Start" },
  { id: "layers",       num: "ii",   label: "Three layers" },
  { id: "categories",   num: "iii",  label: "Categories" },
  { id: "goals",        num: "iv",   label: "Goals to NFRs" },
  { id: "process",      num: "v",    label: "The RE process" },
  { id: "elicit",       num: "vi",   label: "Elicitation" },
  { id: "write",        num: "vii",  label: "Write" },
  { id: "validate",     num: "viii", label: "Validate" },
  { id: "document",     num: "ix",   label: "Document" },
  { id: "estimate",     num: "x",    label: "Estimate" },
  { id: "reference",    num: "xi",   label: "Reference" }
];

const STATE = {
  step: 0,
  stakeholder: null,
  classified: {},   // step ii / iii
  goalAnswers: {},  // step iv
  processOrder: null,
  elicitChoice: {},
  ucCheck: {}
};

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function term(text, def, ar) { return `<span class="term">${esc(text)}<span class="tip">${esc(def)}<span class="ar">${esc(ar||"")}</span></span></span>`; }

function renderProgress() {
  const el = document.getElementById("progress");
  el.innerHTML = '<div class="progress-inner">' + STEPS.map((s, i) => {
    const cls = i === STATE.step ? "active" : (i < STATE.step ? "done" : "");
    return `<span class="dot ${cls}" onclick="setStep(${i})"><span class="roman">${s.num}.</span>${esc(s.label)}</span>`;
  }).join("") + '</div>';
}

function setStep(n) {
  STATE.step = Math.max(0, Math.min(STEPS.length - 1, n));
  renderProgress();
  renderStep();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function nav(label = "Continue", hint = "") {
  const back = STATE.step > 0 ? `<button class="ghost" onclick="setStep(STATE.step - 1)">Back</button>` : `<span></span>`;
  const fwd = STATE.step < STEPS.length - 1
    ? `<button class="primary" onclick="setStep(STATE.step + 1)">${esc(label)}</button>`
    : `<button class="primary" onclick="setStep(0)">Start again</button>`;
  const hintHtml = hint ? `<span class="next-hint">${esc(hint)}</span>` : '<span></span>';
  return `<div class="nav-row">${back}${hintHtml}${fwd}</div>`;
}

function renderStep() {
  const id = STEPS[STATE.step].id;
  const el = document.getElementById("step-content");
  ({
    intro:     renderIntro,
    layers:    renderLayers,
    categories: renderCategories,
    goals:     renderGoals,
    process:   renderProcess,
    elicit:    renderElicit,
    write:     renderWrite,
    validate:  renderValidate,
    document:  renderDocument,
    estimate:  renderEstimate,
    reference: renderReference
  }[id])(el);
}

/* ========================================================================
   STEP i: INTRO
======================================================================== */

function renderIntro(el) {
  el.innerHTML = `
    <div class="masthead">
      <div class="kicker">COMP433 · Chapter 3 · Interactive walkthrough</div>
      <h1>Requirements engineering, <em>from need to contract</em>.</h1>
      <p class="lede">A step-by-step walkthrough that mirrors the lecture flow. We will move a single stakeholder need from elicitation, through user and system requirements, validation, traceability, documentation, and effort estimation. Each step has a small interactive exercise; by the end you will have built one full requirement and seen how the rest of the RE process supports it.</p>
      <div class="meta">
        <div class="meta-item"><span>course</span><span>COMP433</span></div>
        <div class="meta-item"><span>chapter</span><span>3 , Requirements</span></div>
        <div class="meta-item"><span>running example</span><span>Mentcare</span></div>
        <div class="meta-item"><span>format</span><span>11 steps · interactive</span></div>
      </div>
    </div>

    <div class="prose">

      <h3>How to use this walkthrough</h3>
      <p>The eleven steps progress in the same order the lecture covers them: requirement layers, categories, goals versus verifiable NFRs, the RE process, elicitation techniques, writing user and system requirements, validation, documentation, and effort estimation. At any point you can click a step in the progress bar above to revisit it.</p>
      <p>Some terms have small dotted underlines, like ${term("user requirement", "A natural-language statement of what the system must provide, written for the customer to read and confirm.", "متطلب مستخدم")}; hover over them to see a short definition. Interactive exercises track your answers; correct ones are highlighted, mistakes are kept visible so you can compare.</p>

      <h3>The running example: Mentcare</h3>
      <p>Mentcare is the patient information system used in mental-health clinics that Sommerville's 10th edition uses as its running case study (older editions called it MHC-PMS , the same system). It records patient details, consultations, and treatments; generates reports; talks to a national insurance database; and is operated by receptionists, nurses, doctors, and managers.</p>
      <p>It is a good teaching system because every category of requirement (functional, non-functional, domain) and every audience for the requirements document (customer, manager, developer, tester, regulator) shows up clearly in it.</p>

      <div class="callout note">
        <span class="lbl">If you have not read it yet</span>
        <p>The static <a href="/birzeit/comp433/Ch.3/COMP433_Ch3_Requirements_Engineering_Companion.html">Requirements engineering reference handbook</a> covers the same material in a flat reading layout, with deeper citations. The walkthrough below is the same content in exercise form.</p>
      </div>

      <h3>What you will produce by the end</h3>
      <ul>
        <li>One <strong>user requirement</strong> for a Mentcare service, in the lecturer's style.</li>
        <li>Several refined <strong>system requirements</strong> derived from it, each traceable back to the user requirement.</li>
        <li>A <strong>validation</strong> pass over those requirements against the six characteristics.</li>
        <li>A placement of those requirements in the <strong>SRS document structure</strong>.</li>
        <li>An <strong>effort estimate</strong> for the requirement, using the course's simplified per-UR method.</li>
      </ul>
    </div>

    ${nav("Begin", "Next: the three abstraction layers")}
  `;
}

/* ========================================================================
   STEP ii: THREE LAYERS , classify by audience level
======================================================================== */

const LAYERS_ITEMS = [
  { id: "L1", text: "Staff members shall be able to log in to the Mentcare system using a registered username and password.", layer: "user" },
  { id: "L2", text: "Usernames shall be a minimum of 8 alphanumeric characters and uniquely identify the user.", layer: "system" },
  { id: "L3", text: "Passwords shall be stored using bcrypt with cost factor at least 12, in a non-reversible form.", layer: "spec" },
  { id: "L4", text: "Authorised staff (Doctor, Nurse) shall be able to view and edit a patient's medical record.", layer: "user" },
  { id: "L5", text: "All read or write access to patient records shall be logged with user ID, timestamp, and record ID.", layer: "system" },
  { id: "L6", text: "The session token shall be a 256-bit cryptographically-random opaque string, stored in an HttpOnly Secure cookie.", layer: "spec" }
];

function renderLayers(el) {
  if (!STATE.classified.layers) STATE.classified.layers = {};

  const placed = STATE.classified.layers;
  const remaining = LAYERS_ITEMS.filter(it => !placed[it.id]);
  const correctCount = Object.entries(placed).filter(([id, layer]) => LAYERS_ITEMS.find(i => i.id === id).layer === layer).length;
  const totalPlaced = Object.keys(placed).length;

  el.innerHTML = `
    <div class="sect-head">
      <div><span class="num">ii.</span><span class="kicker">Three layers</span></div>
      <h2>Same intent, <em>three audiences</em>, three levels of detail.</h2>
      <p class="lede">User requirements are written for customers. System requirements are written for both customers (to confirm) and developers (to build). Software specifications are written for developers alone. Each layer trades readability for precision in a known way.</p>
    </div>

    <div class="prose">
      <p>${term("Sommerville", "Ian Sommerville, author of the COMP433 reference textbook 'Software Engineering' (10th edition).", "")}'s three-layer model is the working spine of the lecture. Adel's slides use the same model, and so does the structured spec template you will use in your Phase 2 deliverable.</p>

      <div class="three-col">
        <div>
          <h4><span class="iconbox">U</span>User requirements</h4>
          <p>Natural language plus simple tables or diagrams. The customer reads them. No technical jargon, no design choices.</p>
        </div>
        <div>
          <h4><span class="iconbox">S</span>System requirements</h4>
          <p>Structured natural language. Both customers (to confirm) and developers (to build to) read them. Each UR expands into several SRs.</p>
        </div>
        <div>
          <h4><span class="iconbox">D</span>Software specification</h4>
          <p>Developer-level detail: programming-language signatures, algorithms, exact thresholds, hash parameters, protocol versions. Customers rarely read this.</p>
        </div>
      </div>

      <h3>Try it: classify six Mentcare statements</h3>
      <p>Drag each card below into the layer it belongs to. If you put one in the wrong bucket, drag it out and try again, or click it to send it back to the pool.</p>

      <div id="layers-pool" class="classify-pool">
        ${remaining.length === 0 ? '<span style="font-size:13px;color:var(--ink-mute);font-style:italic;">All six placed , see results below.</span>' : remaining.map(it => `<div class="classify-item" draggable="true" data-id="${it.id}" ondragstart="dragStart(event, '${it.id}')">${esc(it.text)}</div>`).join("")}
      </div>

      <div class="classify-zone">
        <div class="classify-bucket" data-layer="user" ondragover="event.preventDefault(); this.classList.add('drop-hover');" ondragleave="this.classList.remove('drop-hover');" ondrop="dropLayer(event, 'user')">
          <div class="bucket-head">User requirement<span class="hint">customer reads &amp; confirms</span></div>
          ${renderPlaced(placed, "user")}
        </div>
        <div class="classify-bucket" data-layer="system" ondragover="event.preventDefault(); this.classList.add('drop-hover');" ondragleave="this.classList.remove('drop-hover');" ondrop="dropLayer(event, 'system')">
          <div class="bucket-head">System requirement<span class="hint">both audiences</span></div>
          ${renderPlaced(placed, "system")}
        </div>
        <div class="classify-bucket" data-layer="spec" ondragover="event.preventDefault(); this.classList.add('drop-hover');" ondragleave="this.classList.remove('drop-hover');" ondrop="dropLayer(event, 'spec')">
          <div class="bucket-head">Software specification<span class="hint">developers</span></div>
          ${renderPlaced(placed, "spec")}
        </div>
      </div>

      <div class="classify-feedback">${totalPlaced === LAYERS_ITEMS.length ? `<span class="score">${correctCount} of ${LAYERS_ITEMS.length} correct</span> , the criterion is the audience that needs to verify the statement, not how technical the words look.` : `Placed ${totalPlaced} of ${LAYERS_ITEMS.length}. Drop each item into the layer whose audience needs to read it to confirm scope.`}</div>

      <div class="callout aside">
        <span class="lbl">A useful rule of thumb</span>
        <p>If a customer can read a sentence and say "yes, that is what we want", it is a user requirement. If only a developer can confirm correctness (because it involves a specific protocol, library, or algorithm), it is a software specification. Everything in between is a system requirement.</p>
      </div>

      <div class="context-card">
        <div class="ctx-eyebrow">History &amp; depth</div>
        <h4 class="ctx-title">Where the three-layer model comes from</h4>
        <p>The three-layer model is not arbitrary. Royce's 1970 paper "Managing the Development of Large Software Systems" treated requirements as a single document; in the decades that followed, IBM's experience reports (and later Sommerville's textbooks) split requirements into a customer-facing and a developer-facing layer, then a third software-specification layer for safety-critical work. By 1998 the IEEE 830 standard codified the split, and ISO/IEC/IEEE 29148:2018 carries it forward.</p>
        <p>The reason the model has survived is the failure mode it prevents. Without the split, customers refuse to sign off (because the document is too technical), or developers cannot build (because it is too vague), or testers cannot verify (because the acceptance criteria are buried in narrative prose). Three layers, three audiences, three reasons for the document to be useful.</p>
        <p>Modern agile teams sometimes argue the model is too heavy. The pragmatic agile equivalent is: user stories at the user-requirement layer, acceptance criteria at the system-requirement layer, technical tasks at the software-specification layer. Different words, same three-layer split.</p>
        <span class="ctx-cite"><strong>Sources.</strong> Royce, W. (1970). Managing the Development of Large Software Systems, <em>IEEE WESCON</em>. IEEE Std 830-1998. ISO/IEC/IEEE 29148:2018. Sommerville, <em>Software Engineering</em>, 10th ed., Chapter 4.</span>
      </div>

      <div class="context-card">
        <div class="ctx-eyebrow">When the layers get conflated</div>
        <h4 class="ctx-title">healthcare.gov, 2013: a documented case of layer confusion</h4>
        <p>The launch of the U.S. federal healthcare exchange in October 2013 is one of the most analysed software failures of the decade. Multiple post-mortem reports (GAO, Office of Inspector General, McKinsey) identified the same recurring pattern: requirements were collected and partially written, but the document conflated business-process desires (user requirements), specific technical mandates (system requirements), and concrete vendor or library choices (software specifications). When the integration vendors started building, they found requirements that left the implementation undefined sitting next to requirements that prescribed an exact library version, with no clarity on which was which.</p>
        <p>The lesson the post-mortems all converge on: the three layers each have a purpose, and writing requirements without knowing which layer you are at <em>guarantees</em> that the eventual artefact will be too vague to build from in some places and too specific to change in others.</p>
        <span class="ctx-cite"><strong>Source.</strong> U.S. Government Accountability Office, <em>HealthCare.gov: Ineffective Planning and Oversight Practices Underscore the Need for Improved Contract Management</em>, GAO-14-694, 2014.</span>
      </div>

      <div class="project-note">
        <strong>Project link.</strong> Your Phase 2 deliverable should contain Sections 4 (User requirements definition) and 6 (System requirements specification) of the SRS, in that order, with every SR carrying the prefix of the UR it refines. Software specifications, when needed, go in the Appendix.
      </div>

    </div>

    ${nav("Continue", "Next: functional, non-functional, or domain?")}
  `;
}

function renderPlaced(placed, layer) {
  const items = Object.entries(placed).filter(([id, l]) => l === layer);
  if (items.length === 0) return '<div style="font-size:11px;color:var(--faint);font-style:italic;">drop here</div>';
  return items.map(([id, l]) => {
    const it = LAYERS_ITEMS.find(i => i.id === id);
    const ok = it.layer === l;
    return `<div class="classify-item ${ok ? "placed-correct" : "placed-wrong"}" onclick="unplaceLayers('${id}')">${esc(it.text)}</div>`;
  }).join("");
}

function dragStart(ev, id) { ev.dataTransfer.setData("text/plain", id); }
function dropLayer(ev, layer) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('drop-hover');
  const id = ev.dataTransfer.getData("text/plain");
  STATE.classified.layers[id] = layer;
  renderStep();
}
function unplaceLayers(id) { delete STATE.classified.layers[id]; renderStep(); }

/* ========================================================================
   STEP iii: CATEGORIES , F vs NF vs Domain
======================================================================== */

const CATEGORIES_ITEMS = [
  { id: "C1", text: "The Mentcare system shall let an authorised doctor view a patient's full medical record.", cat: "functional" },
  { id: "C2", text: "The Mentcare system shall be available 99.5% of the time during business hours.", cat: "nonfunc" },
  { id: "C3", text: "The Mentcare system shall enforce confidentiality rules in accordance with national mental-health-records practices.", cat: "domain" },
  { id: "C4", text: "The Mentcare system shall generate, each day, for each clinic, a list of patients expected to attend that day.", cat: "functional" },
  { id: "C5", text: "User-event response time shall not exceed 1.5 seconds at the 95th percentile.", cat: "nonfunc" },
  { id: "C6", text: "Records of patients flagged as forensic shall be restricted to a named subset of staff per the national clinical-records standard.", cat: "domain" }
];

function renderCategories(el) {
  if (!STATE.classified.categories) STATE.classified.categories = {};
  const placed = STATE.classified.categories;
  const remaining = CATEGORIES_ITEMS.filter(it => !placed[it.id]);
  const correctCount = Object.entries(placed).filter(([id, cat]) => CATEGORIES_ITEMS.find(i => i.id === id).cat === cat).length;
  const totalPlaced = Object.keys(placed).length;

  el.innerHTML = `
    <div class="sect-head">
      <div><span class="num">iii.</span><span class="kicker">Three categories</span></div>
      <h2>Functional, non-functional, <em>domain</em>.</h2>
      <p class="lede">A second classification, orthogonal to the three layers above. Functional requirements describe what the system does. Non-functional requirements describe how well. Domain requirements come from the application area and reflect its rules.</p>
    </div>

    <div class="prose">

      <div class="three-col">
        <div>
          <h4><span class="iconbox">F</span>Functional</h4>
          <p><strong>What the system does.</strong> Services it provides, how it reacts to inputs, how it behaves in specific situations.</p>
        </div>
        <div>
          <h4><span class="iconbox">N</span>Non-functional</h4>
          <p><strong>How well it does it.</strong> Performance, reliability, security, usability, portability , and the constraints on how it is developed.</p>
        </div>
        <div>
          <h4><span class="iconbox">D</span>Domain</h4>
          <p><strong>What the application area demands.</strong> Constraints from the domain itself (medical confidentiality, train braking physics, banking regulation).</p>
        </div>
      </div>

      <div class="callout warn">
        <span class="lbl">Why NFRs sometimes matter more than FRs</span>
        <p>If a functional requirement is missing, the system loses a feature. If a non-functional requirement is missed, the system can become unusable. "An aircraft control system that gives the right output thirty seconds late is not a slow aircraft control system; it is a crashed aircraft."</p>
      </div>

      <h3>Try it: classify six more Mentcare statements</h3>

      <div id="cat-pool" class="classify-pool">
        ${remaining.length === 0 ? '<span style="font-size:13px;color:var(--ink-mute);font-style:italic;">All six placed.</span>' : remaining.map(it => `<div class="classify-item" draggable="true" data-id="${it.id}" ondragstart="dragStartCat(event, '${it.id}')">${esc(it.text)}</div>`).join("")}
      </div>

      <div class="classify-zone">
        <div class="classify-bucket" data-cat="functional" ondragover="event.preventDefault(); this.classList.add('drop-hover');" ondragleave="this.classList.remove('drop-hover');" ondrop="dropCat(event, 'functional')">
          <div class="bucket-head">Functional<span class="hint">a service or behaviour</span></div>
          ${renderPlacedCat(placed, "functional")}
        </div>
        <div class="classify-bucket" data-cat="nonfunc" ondragover="event.preventDefault(); this.classList.add('drop-hover');" ondragleave="this.classList.remove('drop-hover');" ondrop="dropCat(event, 'nonfunc')">
          <div class="bucket-head">Non-functional<span class="hint">a quality threshold</span></div>
          ${renderPlacedCat(placed, "nonfunc")}
        </div>
        <div class="classify-bucket" data-cat="domain" ondragover="event.preventDefault(); this.classList.add('drop-hover');" ondragleave="this.classList.remove('drop-hover');" ondrop="dropCat(event, 'domain')">
          <div class="bucket-head">Domain<span class="hint">a rule from the application area</span></div>
          ${renderPlacedCat(placed, "domain")}
        </div>
      </div>

      <div class="classify-feedback">${totalPlaced === CATEGORIES_ITEMS.length ? `<span class="score">${correctCount} of ${CATEGORIES_ITEMS.length} correct</span> , domain requirements are the ones most often missed; they read like functional or non-functional but reference an authority outside the system.` : `Placed ${totalPlaced} of ${CATEGORIES_ITEMS.length}.`}</div>

      <h3>NFR sub-classification</h3>
      <p>Sommerville further classifies non-functional requirements by where they come from. The family determines who you have to negotiate with if it changes.</p>

      <div class="three-col">
        <div>
          <h4>Product</h4>
          <p>The product itself must behave a certain way. Efficiency, dependability, security, usability.</p>
        </div>
        <div>
          <h4>Organisational</h4>
          <p>From the customer's policies. Mandatory IDE, language, methodology, identity card for authentication.</p>
        </div>
        <div>
          <h4>External</h4>
          <p>Regulatory, ethical, legislative. GDPR-equivalent privacy, compliance with the Palestinian Personal Data Protection Law.</p>
        </div>
      </div>

      <div class="context-card">
        <div class="ctx-eyebrow">Real cases · NFR failures with documented consequences</div>
        <h4 class="ctx-title">When missed non-functional requirements broke the system</h4>
        <p><strong>Therac-25 (1985-1987).</strong> A radiation-therapy machine that delivered massive overdoses to six patients (two fatal). The functional requirement "deliver the prescribed dose" was met. The non-functional requirement "no race condition between the operator's input and the beam mode interlock" was never written down because the previous Therac-20 had hardware interlocks that masked the same software defect. When the Therac-25 dropped the hardware interlocks to save cost, the missing NFR became fatal. Nancy Leveson and Clark Turner's 1993 analysis is the canonical case study in safety-critical software.</p>
        <p><strong>Ariane 5 Flight 501 (1996).</strong> The European Space Agency's new rocket exploded 37 seconds after launch. The functional requirement (re-use the Ariane 4 inertial reference system software) was met. The non-functional requirement "the software is valid for the flight envelope of Ariane 5" was never written; the Ariane 4 software handled a 16-bit horizontal-velocity range that Ariane 5 exceeded in normal flight. A floating-point overflow shut down the navigation system; the rocket self-destructed. ESA's enquiry board report (Lions, 1996) treats this as the single most expensive software defect in history (USD 370 million).</p>
        <p><strong>Knight Capital (2012).</strong> A trading-system deployment with no specified "all eight servers must be on the same code version" non-functional requirement; one server ran old code that interpreted a new flag differently. The system placed USD 7 billion of unwanted trades in 45 minutes, costing the firm USD 460 million and effectively ending its independent existence.</p>
        <p class="ctx-cite"><strong>The pattern.</strong> In each case the functional requirements were met. The system did what it was supposed to do. The non-functional requirement that wasn't written down was the one that mattered, and the consequences were measured in lives or hundreds of millions of dollars. This is why Section iv of this walkthrough exists: converting goals to verifiable NFRs is the most expensive failure mode in software engineering.</p>
        <span class="ctx-cite"><strong>Sources.</strong> Leveson, N. and Turner, C. (1993). An Investigation of the Therac-25 Accidents. <em>IEEE Computer</em>, 26(7), 18-41. Lions, J. (1996). Ariane 5 Flight 501 Failure: Report by the Inquiry Board. ESA. SEC Order Instituting Administrative Proceedings against Knight Capital Americas LLC, 2013.</span>
      </div>

      <div class="project-note">
        <strong>Project link.</strong> For your Phase 2, write at least one verifiable NFR per product / organisational / external category. The temptation will be to write only product NFRs (performance, availability) because those are easiest. Write the organisational and external ones too; they are the ones missed in the cases above.
      </div>

    </div>

    ${nav("Continue", "Next: turning vague goals into testable NFRs")}
  `;
}

const GOAL_PAIRS = [
  {

      { text: "Medical staff shall be able to complete all Mentcare functions after four hours of training; after this training, experienced users shall make no more than two errors per hour of system use.", verifiable: true, why: "Names the cohort (experienced users after four hours of training), the measure (errors per hour), and the threshold (two)." },

    options: [

      { text: "All client-server traffic shall use TLS 1.3 or above. All read or write access to patient records shall be logged with user ID, timestamp, and record ID. Failed login attempts shall be rate-limited to five per ten minutes per account.", verifiable: true, why: "Three concrete, testable thresholds. Each clause maps to an acceptance test." }

function renderGoals(el) {
  if (!STATE.goalAnswers) STATE.goalAnswers = {};

  el.innerHTML = `
    <div class="sect-head">
      <div><span class="num">iv.</span><span class="kicker">Goals to verifiable NFRs</span></div>
      <h2>A goal is a wish. A verifiable NFR is a <em>contract</em>.</h2>
      <p class="lede">Vague intentions are useful for direction, but useless as contracts. Converting one into the other is one of the most teachable skills in requirements engineering, because the failure mode (an adjective with no measure) is so easy to recognise once you've seen it.</p>
    </div>

    <div class="prose">

      <h3>Two Mentcare goals; for each, which rewrite is verifiable?</h3>

      ${GOAL_PAIRS.map((pair, idx) => {
        const chosen = STATE.goalAnswers[pair.id];
        return `
        <div class="multicheck-card">
          <div class="req">${esc(pair.goal)}<br><span style="color:var(--ink-mute);font-size:12px;font-family:var(--sans);font-style:italic;">A goal: a general intention. Not testable as written.</span></div>
          <div class="pickone">
            ${pair.options.map((opt, i) => {
              let cls = "";
              if (chosen !== undefined) {
                if (i === chosen) cls = opt.verifiable ? "correct" : "wrong";
                else if (opt.verifiable) cls = "correct";
              }
              return `<div class="pickone-card ${cls}" onclick="pickGoal('${pair.id}', ${i})"><h5>Option ${String.fromCharCode(65 + i)}</h5><p>${esc(opt.text)}</p></div>`;
            }).join("")}
          </div>
          ${chosen !== undefined ? `<div class="multicheck-feedback ${pair.options[chosen].verifiable ? 'right' : 'wrong'}" style="margin-top:10px;"><strong>${pair.options[chosen].verifiable ? '✓ Correct.' : '✗ Not verifiable.'}</strong> ${esc(pair.options[chosen].why)}</div>` : ''}
        </div>
        `;
      }).join("")}

      <h3>What makes an NFR verifiable</h3>
      <p>Whatever the property, the rewrite needs three things:</p>
      <ul>
        <li><strong>The cohort.</strong> Who is the requirement about? "Experienced users", "first-time users", "the 95th percentile", "all clinics".</li>
        <li><strong>The measure.</strong> A property that can be observed. Errors per hour, seconds at percentile p, percentage of failed logins, MB of memory.</li>
        <li><strong>The threshold.</strong> A specific value the system must satisfy. "Under 1.5 seconds", "at least 99.5%", "no more than two".</li>
      </ul>

      <p>If any of the three is missing, the statement is still a goal. The standard ${term("metrics", "Speed: transactions per second; response time. Size: MB. Ease of use: training time, help frames. Reliability: MTBF, availability. Robustness: time to restart. Portability: percentage of target-dependent statements.", "")} table in the lecture lists the most common measures by property.</p>

      <div class="context-card">
        <div class="ctx-eyebrow">Depth · ISO 9241-11 on usability</div>
        <h4 class="ctx-title">When "usability" actually has a definition</h4>
        <p>"Usability" is the most-abused word in software requirements. Until someone names a specific measure, it is a goal. ISO 9241-11:2018 gives the working definition that has been the international standard since 1998: usability is "the extent to which a system, product or service can be used by specified users to achieve specified goals with <em>effectiveness, efficiency, and satisfaction</em> in a specified context of use".</p>
        <p>Each of the three dimensions has standard measures:</p>
        <ul>
          <li><strong>Effectiveness:</strong> completion rate (% of attempts that succeed), error rate (errors per attempt).</li>
          <li><strong>Efficiency:</strong> time on task, number of steps, mental load.</li>
          <li><strong>Satisfaction:</strong> System Usability Scale (Brooke, 1986), Net Promoter Score, UMUX-Lite.</li>
        </ul>
        <p>A usability requirement written against ISO 9241-11 names the cohort, the dimension, the measure, and the threshold. For example: "For experienced users (after four hours of training), the swap-request task shall complete in under 90 seconds median time (efficiency), with at most 5% of attempts failing (effectiveness), with a post-task SUS score of 70 or above (satisfaction)."</p>
        <span class="ctx-cite"><strong>Sources.</strong> ISO 9241-11:2018, <em>Ergonomics of human-system interaction, Part 11: Usability: Definitions and concepts</em>. Brooke, J. (1996). SUS: A "quick and dirty" usability scale. In <em>Usability Evaluation in Industry</em>. CRC Press.</span>
      </div>

      <div class="context-card">
        <div class="ctx-eyebrow">Real cases · constraints that became identity</div>
        <h4 class="ctx-title">When a single NFR defined a product</h4>
        <p><strong>Twitter, 140 characters.</strong> The 140-character limit was originally a technical constraint: an SMS message holds 160 characters; 20 were reserved for the username, leaving 140 for the message body. The constraint was a non-functional requirement (interoperability with SMS) before it became the most recognisable feature of the product. When Twitter doubled the limit to 280 characters in 2017, the company published the analysis that justified the change; the 140-character constraint had become so central to the product that loosening it was a strategic decision, not a routine engineering one.</p>
        <p><strong>iPhone, no stylus.</strong> At the iPhone's introduction in January 2007, Steve Jobs explicitly framed the absence of a stylus as a requirement, not a missing feature. The competitive devices of the time (Palm, Windows Mobile, BlackBerry) were stylus-driven. The single NFR "operable with fingers, in all primary tasks, with no accessory" cascaded into the 44-point minimum interactive element size, the gesture vocabulary, the on-screen keyboard layout, and even the choice of capacitive over resistive touch hardware. Twenty years on, the entire smartphone market converged on the same NFR.</p>
        <p><strong>WhatsApp, end-to-end encryption.</strong> WhatsApp introduced end-to-end encryption for all messages in 2016. The decision was a non-functional security requirement: messages between users must be cryptographically protected so that no party other than the conversation participants, including WhatsApp itself, can read them. The requirement reshaped the product: backups had to be redesigned, group dynamics changed, certain moderation interventions became impossible. The NFR became a defining feature; competitor messaging products converged on it within five years.</p>
        <p class="ctx-cite">The lesson all three cases share: a single well-written non-functional requirement, with a measurable threshold, can define a product's identity. The wishful NFR ("be modern", "be secure", "be fast") never does.</p>
        <span class="ctx-cite"><strong>Sources.</strong> Twitter Engineering Blog, "Tweeting Made Easier" (2017). Apple, iPhone Macworld Keynote, January 2007. WhatsApp Security Whitepaper (2016).</span>
      </div>

    </div>

    ${nav("Continue", "Next: the four sub-processes of RE")}
  `;
}

function renderProcess(el) {
  el.innerHTML = `
    <div class="sect-head">
      <div><span class="num">v.</span><span class="kicker">The RE process</span></div>
      <h2>Four interleaved sub-processes, <em>not a sequence</em>.</h2>
      <p class="lede">Sommerville's RE process is often drawn as a four-step pipeline. In practice the steps interleave, loop back, and overlap. Knowing the four activities is essential; expecting them to run in order is naïve.</p>
    </div>

    <div class="prose">

      <div class="three-col" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
        <div>
          <h4><span class="iconbox">1</span>Elicitation</h4>
          <p>Working with stakeholders to discover the application domain, the services the system should provide, and its constraints. The part of RE that cannot be done at your desk.</p>
        </div>
        <div>
          <h4><span class="iconbox">2</span>Analysis</h4>
          <p>Understanding the implications: classifying, organising, prioritising, negotiating between stakeholders. Output: the agreed specification.</p>
        </div>
        <div>
          <h4><span class="iconbox">3</span>Validation</h4>
          <p>Checking that the specified requirements actually define the system the customer wants. Six characteristics, three techniques.</p>
        </div>
        <div>
          <h4><span class="iconbox">4</span>Management</h4>
          <p>Managing change. Real projects discover new requirements after the spec is "frozen"; treating the document as immutable is unrealistic. RE management is what makes change tractable.</p>
        </div>
      </div>

      <h3>Why analysis is hard</h3>
      <p>Four recurring problems show up across industries and project sizes:</p>

      <div class="checklist">
        <div class="checklist-item"><span class="check-num">1.</span><div class="check-body"><strong>Stakeholders do not know what they want.</strong> They describe what currently exists, not what they need. Their answer to "what should the system do?" tends to describe the current process plus minor frustrations.</div></div>
        <div class="checklist-item"><span class="check-num">2.</span><div class="check-body"><strong>They use their own language.</strong> Domain vocabulary is dense. Two stakeholders may use the same word for different things, or different words for the same thing. A requirements engineer is also a translator.</div></div>
        <div class="checklist-item"><span class="check-num">3.</span><div class="check-body"><strong>Different stakeholders conflict.</strong> The doctor wants speed; the auditor wants extensive logging; the receptionist wants minimal data entry. Conflicts are not bugs in the elicitation; they are the work of the analyst.</div></div>
        <div class="checklist-item"><span class="check-num">4.</span><div class="check-body"><strong>Requirements keep changing.</strong> The business changes while you are analysing. Regulations change. Mergers happen. RE management exists exactly because the spec is never truly frozen.</div></div>
      </div>

      <div class="callout note">
        <span class="lbl">For Phase 2 of the project</span>
        <p>"Requirements analysis" in your project is the step where you take raw interview notes, sort each statement (F / NF / Domain), decide which layer (user or system), write the user requirements, decompose each into system requirements, and apply the six validation characteristics as a sanity check before submission. That sequence is the Phase 2 deliverable.</p>
      </div>

      <h3>Requirements management, in detail</h3>
      <p>Before a project begins, three decisions are made about how requirements will be managed:</p>

      <div class="three-col">
        <div>
          <h4>Identification</h4>
          <p>Every requirement gets a unique ID (UR1, SR1.1, ...). The ID is the entry point for traceability across the entire project lifecycle.</p>
        </div>
        <div>
          <h4>Change management</h4>
          <p>A defined process to assess the impact and cost of a proposed change before accepting it. Often involves a change-control board with both customer and supplier representation.</p>
        </div>
        <div>
          <h4>Tool support</h4>
          <p>From dedicated tools (DOORS, Jama) to lighter options (spreadsheets, Notion, a simple database). Pick what your team will actually maintain.</p>
        </div>
      </div>

      <div class="context-card">
        <div class="ctx-eyebrow">History &amp; depth</div>
        <h4 class="ctx-title">From Royce to Boehm to agile: how the RE process model evolved</h4>
        <p><strong>1970, Royce.</strong> Winston Royce's WESCON paper introduced what became known (often unfairly) as the "waterfall" model. Requirements analysis was the first phase; the document, once written, was treated as fixed. Royce himself argued against this in the same paper, recommending iteration; the field largely ignored that part.</p>
        <p><strong>1988, Boehm.</strong> Barry Boehm's spiral model made iteration explicit. Requirements were re-examined at every cycle, with risk analysis between phases. The four sub-processes (elicitation, analysis, validation, management) were treated as recurring activities, not one-time phases. This is closer to what Sommerville teaches today.</p>
        <p><strong>2001, Agile Manifesto.</strong> The agile community argued that any document-heavy RE process produces specifications that are obsolete before the system ships. The agile counter-proposal: short iterations, with user stories that get refined as the team learns. Ron Jeffries' "three Cs" of a user story (Card, Conversation, Confirmation) are an extreme compression of the four sub-processes.</p>
        <p><strong>Modern practice.</strong> Most industrial teams now sit somewhere between Boehm and the Agile Manifesto. The four sub-processes are still recognisable; the deliverables are lighter than IEEE 830 prescribed; the iteration cycle is much faster than Boehm imagined. Plan-driven processes (used in regulated medical, aerospace, and defence work) retain the heavyweight document; agile processes use a continuously-edited backlog as the equivalent.</p>
        <span class="ctx-cite"><strong>Sources.</strong> Royce, W. (1970). Managing the Development of Large Software Systems. <em>IEEE WESCON</em>. Boehm, B. (1988). A Spiral Model of Software Development and Enhancement. <em>IEEE Computer</em>, 21(5), 61-72. Beck, K. et al. (2001). <em>Manifesto for Agile Software Development</em>. Jeffries, R. (2001). Essential XP: Card, Conversation, Confirmation. Sommerville, 10th ed., Chapter 4.</span>
      </div>

      <div class="context-card">
        <div class="ctx-eyebrow">When the process gets skipped</div>
        <h4 class="ctx-title">The Standish Group's CHAOS reports</h4>
        <p>The Standish Group has published annual reports on software project outcomes since 1994. The headline finding, repeated across thirty years, is that the strongest predictors of project failure are <em>incomplete requirements</em> and <em>changes to requirements without process</em>. The latest reports show that fewer than 30 percent of medium-to-large projects deliver on time and on budget. The percentage that fail outright (cancelled before delivery) sits between 15 and 20 percent. The single most-cited cause is consistently the requirements stage, not the implementation stage.</p>
        <p>The reports have been criticised for their methodology, but the qualitative finding is supported by more rigorous studies: ${term("Hofmann and Lehner", "Hofmann, H. and Lehner, F. (2001). Requirements engineering as a success factor in software projects. IEEE Software, 18(4), 58-66. Survey of 15 projects across 9 companies.", "")} (IEEE Software 2001) interviewed teams at 9 companies and found that all six high-performing teams had a defined RE process, while four of nine low-performing teams had none.</p>
        <span class="ctx-cite"><strong>Sources.</strong> Standish Group, <em>CHAOS Report</em> series (1994 to present). Hofmann, H. and Lehner, F. (2001). Requirements engineering as a success factor in software projects. <em>IEEE Software</em>, 18(4), 58-66.</span>
      </div>

      <div class="project-note">
        <strong>Project link.</strong> Your project has two phases that map directly to the four sub-processes. Phase 2 covers elicitation, analysis, and validation. Phase 3 (system modelling, design) treats the SRS as a managed artefact: every design decision references the requirement it implements; every change to a requirement triggers a review of the affected models.
      </div>

    </div>

    ${nav("Continue", "Next: how to elicit requirements in practice")}
  `;
}

      <p class="lede">A user requirement is the one-sentence summary the customer signs off on. The system requirements are the testable refinements the developer builds and the tester verifies. Both layers stay in the document; the system requirements trace back to the user requirement they refine.</p>

    <div class="prose">

      <h3>The stakeholder need (Mentcare)</h3>
      <div class="quotebox">
        <p>"Receptionists at all five clinics should be able to set up new patients in the system. That's the bottleneck right now , we have to phone IT every time we get a referral, and they take a day to set up the account."</p>
        <span class="source">Clinic manager, Mentcare elicitation interview (paraphrased).</span>
      </div>

      <h3>From need to user requirement</h3>
      <p>The need above mixes business pain (waiting for IT) with desired capability (receptionist self-service). The user requirement strips out the pain and states the capability cleanly, in language the customer can confirm.</p>

      <div class="req-card">
        <span class="id">UR6:</span> Authorised staff (Receptionist, Nurse) shall be able to register a patient and create a patient medical record.
      </div>

      <p><strong>Why this is good as a user requirement.</strong> One sentence, plain English, names the actor (Authorised staff, with sub-roles), names the goal (register a patient, create the record), no implementation detail, no thresholds. The customer can read it and say "yes, that's what we mean".</p>

      <h3>From user requirement to system requirements</h3>
      <p>Now the system requirements. Each one is a testable, atomic obligation. Note the numbering: every system requirement carries the user requirement's prefix, which is the foundation of traceability.</p>

      <div class="req-card system">
        <span class="id">SR6.1:</span> The Mentcare system shall provide a "Create patient record" action accessible only to users whose role is Receptionist or Nurse.
      </div>
      <div class="req-card system">
        <span class="id">SR6.2:</span> The "Create patient record" action shall accept the following mandatory fields: full name, date of birth, national identifier, registering clinic, primary doctor. Records with any mandatory field missing shall be rejected.
      </div>
      <div class="req-card system">
        <span class="id">SR6.3:</span> The system shall reject any attempt to create a record with a national identifier that already exists in the system, and shall offer the existing record for inspection instead.
      </div>
      <div class="req-card system">
        <span class="id">SR6.4:</span> The system shall assign a unique patient identifier on successful creation and shall display it to the receptionist for reference.
      </div>
      <div class="req-card system">
        <span class="id">SR6.5:</span> All creation events shall be written to the audit log with the registering user, the patient identifier, the timestamp, and the registering clinic.
      </div>

      <p>${term("Trace back", "Each SR points to the UR it refines. The pattern UR# -> SR#.1, SR#.2, ... is the convention used in the lecture and in the Sommerville textbook.", "")}: every SR above includes the prefix "6." for traceability back to UR6. If UR6 is ever revised, the SRs are the immediate impact; the audit logging, the rejection on duplicate, and the role-based access are all derived from one user requirement that the customer signed off on.</p>

      <h3>What did and did not make it into the SRs</h3>

      <div class="two-col">
        <div>
          <h4>Made it in</h4>
          <ul>
            <li>Role-based access to the action (SR6.1)</li>
            <li>Mandatory field list (SR6.2)</li>
            <li>Duplicate detection (SR6.3)</li>
            <li>Identifier assignment (SR6.4)</li>
            <li>Audit logging (SR6.5)</li>
          </ul>
        </div>
        <div>
          <h4>Did not make it in (yet)</h4>
          <ul>
            <li>The UI design (a form? a wizard? a mobile flow?) , that is a software-specification or design decision.</li>
            <li>The exact field validation rules (e.g., regex for national identifier) , those belong in the data dictionary or in a separate validation requirement.</li>
            <li>Performance thresholds for creation , would be a separate NFR, traced to UR6 if relevant.</li>
          </ul>
        </div>
      </div>

      <div class="callout note">
        <span class="lbl">Writing rule</span>
        <p>Use <strong>shall</strong> for mandatory requirements and <strong>should</strong> for desirable ones. SR6.3's "shall reject any attempt" leaves no room for the developer to soften the rule. If duplicate detection were "desirable but not blocking", we would write "should reject" , the project would still accept a release that didn't enforce it.</p>
      </div>

    </div>

    ${nav("Continue", "Next: validate the requirements")}
  `;
}
