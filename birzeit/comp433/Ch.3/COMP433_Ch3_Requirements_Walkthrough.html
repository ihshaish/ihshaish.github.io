const VALIDATE_REQS = [
  {
    id: "V1",
    text: "The system shall be easy to use by staff members.",
    flaws: ["unambiguity", "verifiability"],
    why: "\"Easy to use\" has no measure. Without a measurable threshold, the requirement cannot be verified, and reasonable people will interpret it differently."
  },
  {
    id: "V2",
    text: "Patient lookups shall return within 2 seconds at the 95th percentile, measured at the application layer under nominal load.",
    flaws: [],
    why: "Specific cohort (95th percentile), specific measure (seconds at the application layer), specific threshold (2). Verifiable, unambiguous, traceable."
  },
  {
    id: "V3",
    text: "The system shall be fast and secure.",
    flaws: ["unambiguity", "verifiability", "atomicity"],
    why: "Two unrelated NFRs in one sentence (fast, secure), each unverifiable. Split into two requirements, each with a measure and a threshold."
  },
  {
    id: "V4",
    text: "The Mentcare system shall comply with all relevant medical-records regulations.",
    flaws: ["unambiguity", "verifiability", "completeness"],
    why: "Names no specific regulation. \"All relevant\" leaves the supplier guessing. Rewrite to name the regulation explicitly (e.g., HStan-03-2006-priv) and the clauses being implemented."
  }
];

function renderValidate(el) {
  if (!STATE.classified.validate) STATE.classified.validate = {};
  const checks = STATE.classified.validate;
  const FLAW_OPTIONS = [
    { key: "unambiguity", label: "Unambiguous" },
    { key: "verifiability", label: "Verifiable" },
    { key: "completeness", label: "Complete" },
    { key: "consistency", label: "Consistent" },
    { key: "traceability", label: "Traceable" },
    { key: "atomicity", label: "Atomic (one requirement per statement)" }
  ];

  function score(reqId) {
    const req = VALIDATE_REQS.find(r => r.id === reqId);
    const userFlaws = checks[reqId] || [];
    if (req.flaws.length === 0) {
      return userFlaws.length === 0 ? "✓ correct: no flaws to flag" : `× flagged a flaw that isn't there; the requirement is well-formed.`;
    }
    const matched = req.flaws.filter(f => userFlaws.includes(f)).length;
    const extra = userFlaws.filter(f => !req.flaws.includes(f)).length;
    if (matched === req.flaws.length && extra === 0) return "✓ correct on all counts";
    if (matched === req.flaws.length && extra > 0) return `partial: caught the right ${matched} flaws but also flagged ${extra} that don't apply.`;
    return `partial: caught ${matched} of ${req.flaws.length} flaws.`;
  }

  el.innerHTML = `
    <div class="sect-head">
      <div><span class="num">viii.</span><span class="kicker">Validation</span></div>
      <h2>Six characteristics, <em>applied to every requirement</em>.</h2>
      <p class="lede">Requirements validation asks whether the specified requirements define the system the customer actually wants. It is distinct from verification, which checks whether the system meets the spec. For each requirement, ask the six (sometimes seven) questions.</p>
    </div>

    <div class="prose">

      <h3>The six characteristics</h3>
      <div class="body-table-card">
        <table class="body-table">
          <thead><tr><th>Characteristic</th><th>The question</th></tr></thead>
          <tbody>
            <tr><td>Correctness / Validity</td><td>Does this requirement reflect what the customer actually needs?</td></tr>
            <tr><td>Unambiguity</td><td>Can it be interpreted in more than one way? If yes, rewrite.</td></tr>
            <tr><td>Completeness</td><td>Are all the services the customer needs included? Are exception cases described?</td></tr>
            <tr><td>Consistency</td><td>Does it conflict with any other requirement?</td></tr>
            <tr><td>Verifiability</td><td>Can it be tested objectively? Is there a measure and a threshold?</td></tr>
            <tr><td>Traceability</td><td>Does it carry a unique identifier and link to its source and to the design / tests that realise it?</td></tr>
          </tbody>
        </table>
      </div>

      <p>A useful seventh is <strong>realism / feasibility</strong>: can the requirement be implemented in the available time, budget, team skills, and technology? An impossible requirement, no matter how desirable, must be revised before the contract is signed.</p>

      <h3>The three techniques</h3>
      <div class="three-col">
        <div>
          <h4>Reviews</h4>
          <p>Structured walkthrough of the document by stakeholders. Cheap; good for ambiguity and inconsistency. Weak for gaps.</p>
        </div>
        <div>
          <h4>Prototyping</h4>
          <p>Executable model the customer interacts with. Surfaces requirements no review would find.</p>
        </div>
        <div>
          <h4>Test-case generation</h4>
          <p>Write an acceptance test against each requirement. If you can't write a test, the requirement is not verifiable.</p>
        </div>
      </div>

      <div class="callout warn">
        <span class="lbl">The economic case for validation</span>
        <p>Boehm's classic finding: a requirements error fixed after release can cost up to 100 times the cost of the same error caught during requirements analysis. Validation is therefore done deliberately, not casually, before sign-off.</p>
      </div>

      <div class="context-card">
        <div class="ctx-eyebrow">Depth · IEEE / ISO criteria</div>
        <h4 class="ctx-title">What the standards actually require</h4>
        <p>The six characteristics above are the working summary. The full criteria are codified in two standards every requirements engineer should be aware of.</p>
        <p><strong>IEEE Std 830-1998</strong> (now historical, but still widely referenced) defines eight qualities: correct, unambiguous, complete, consistent, ranked for importance and / or stability, verifiable, modifiable, traceable. The "ranked" criterion is often dropped from compressed summaries; it is the one that prevents the scope-cut argument that derails projects under pressure.</p>
        <p><strong>ISO/IEC/IEEE 29148:2018</strong> (current) adds <em>singular</em> (one requirement per statement) and <em>feasible</em> (technically and economically achievable). The ISO version also formalises the SMART criteria for requirement quality: Specific, Measurable, Achievable, Relevant, Time-bound. SMART originated in management theory (George Doran, 1981) but has been adopted across requirements engineering.</p>
        <p>For the COMP433 project, the six characteristics in the lecture are sufficient. For industrial work in regulated domains (medical, aerospace, automotive), the full ISO/IEC/IEEE 29148 list is the contractual baseline.</p>
        <span class="ctx-cite"><strong>Sources.</strong> IEEE Std 830-1998. ISO/IEC/IEEE 29148:2018. Doran, G. T. (1981). There's a S.M.A.R.T. way to write management's goals and objectives. <em>Management Review</em>, 70(11), 35-36.</span>
      </div>

      <div class="context-card">
        <div class="ctx-eyebrow">When reviews caught the defect in time</div>
        <h4 class="ctx-title">Two cases where requirements validation prevented disaster</h4>
        <p><strong>Space Shuttle on-board software (NASA / Lockheed-Martin, 1990s).</strong> The Space Shuttle's flight software is the most-validated software in history. NASA's process required every requirement to be reviewed by an independent team (the Independent Verification and Validation organisation, set up exactly for this); typical projects produced more pages of review output than of code. The shuttle programme flew 135 missions with zero software-caused mission failures. Industry analyses (Nancy Leveson; SEI case studies) attribute this directly to the depth of requirements validation.</p>
        <p><strong>Airbus A380 wing-flex (early 2000s).</strong> During requirements review for the A380's flight control software, a reviewer noticed an implicit assumption that wing-flex would stay within Airbus's historical envelope. The A380's larger wings exceeded that envelope; without the requirement being explicitly written, the control software would have miscalculated control surface positions at high load. The requirement was added; the software was rewritten before flight test.</p>
        <p><strong>The opposite case (counter-example).</strong> Boeing's 737 MAX MCAS system shipped with a requirement that, on review by the certification authority, would likely have been flagged: a single-sensor input drove a flight-critical control surface, with no requirement for cross-check or pilot override. The requirements review was either skipped or insufficiently rigorous, and 346 people died in two crashes. Post-incident reports (NTSB, JATR) recommended exactly the kind of independent requirements review the Space Shuttle had used.</p>
        <span class="ctx-cite"><strong>Sources.</strong> Madden, W. A. and Rone, K. Y. (1984). Design, development, integration: Space Shuttle primary flight software system. <em>Communications of the ACM</em>. Joint Authorities Technical Review (JATR), <em>Observations, Findings, and Recommendations from the Joint Authorities Technical Review of the Boeing 737 MAX FCS</em>, 2019.</span>
      </div>

      <h3>Try it: flag the flaws in four Mentcare requirements</h3>
      <p>For each requirement below, tick every characteristic the requirement <em>fails</em>. Some have multiple flaws; one is well-formed and needs nothing ticked.</p>

      ${VALIDATE_REQS.map(req => {
        const flagged = checks[req.id] || [];
        const submitted = (req.id + "_submit") in checks;
        return `
        <div class="multicheck-card">
          <div class="req"><span class="id">${esc(req.id)}:</span> ${esc(req.text)}</div>
          <div class="multicheck-options">
            ${FLAW_OPTIONS.map(opt => `
              <label class="${flagged.includes(opt.key) ? 'checked' : ''}">
                <input type="checkbox" ${flagged.includes(opt.key) ? 'checked' : ''} onclick="toggleFlaw('${req.id}', '${opt.key}')">
                fails ${esc(opt.label)}
              </label>
            `).join("")}
          </div>
          <div class="multicheck-actions">
            <button class="primary" onclick="submitValidate('${req.id}')">Check</button>
            <span class="multicheck-feedback ${submitted ? (score(req.id).startsWith('✓') ? 'right' : 'wrong') : ''}">${submitted ? score(req.id) + " , " + esc(req.why) : ''}</span>
          </div>
        </div>
        `;
      }).join("")}

    </div>

    ${nav("Continue", "Next: place the requirement in the SRS document")}
  `;
}

function toggleFlaw(reqId, key) {
  if (!STATE.classified.validate[reqId]) STATE.classified.validate[reqId] = [];
  const list = STATE.classified.validate[reqId];
  const idx = list.indexOf(key);
  if (idx >= 0) list.splice(idx, 1); else list.push(key);
  delete STATE.classified.validate[reqId + "_submit"];
  renderStep();
}
function submitValidate(reqId) { STATE.classified.validate[reqId + "_submit"] = true; renderStep(); }

/* ========================================================================
   EFFORT CALCULATOR (shared with the handbook)
======================================================================== */

const EXAMPLE = [
  { ur: "UR1", desc: "Account registration",      devs: 2, eff: 2 },
  { ur: "UR2", desc: "Login & authentication",    devs: 1, eff: 3 },
  { ur: "UR3", desc: "Patient record management", devs: 3, eff: 2 },
  { ur: "UR4", desc: "Reporting & exports",       devs: 4, eff: 1 }
];
let calcRows = JSON.parse(JSON.stringify(EXAMPLE));

function calcRender() {
  const body = document.getElementById("urBody");
  if (!body) return;
  body.innerHTML = calcRows.map((r, i) => `
    <tr>
      <td><input type="text" value="${esc(r.ur)}" oninput="calcRows[${i}].ur=this.value; recompute();"></td>
      <td><input type="text" value="${esc(r.desc)}" oninput="calcRows[${i}].desc=this.value;"></td>
      <td><input type="number" min="0" step="1" value="${r.devs}" oninput="calcRows[${i}].devs=parseFloat(this.value)||0; recompute();"></td>
      <td><input type="number" min="0" step="0.5" value="${r.eff}" oninput="calcRows[${i}].eff=parseFloat(this.value)||0; recompute();"></td>
      <td><input type="text" readonly class="totalcol" value="${(r.devs*r.eff).toFixed(1)}"></td>
      <td><button class="x-btn" onclick="calcRemove(${i})" title="Remove">&times;</button></td>
    </tr>
  `).join("");
}
function addUR() {
  calcRows.push({ ur: "UR" + (calcRows.length + 1), desc: "", devs: 1, eff: 1 });
  calcRender();
  recompute();
}
function calcRemove(i) {
  calcRows.splice(i, 1);
  if (calcRows.length === 0) calcRows.push({ ur: "UR1", desc: "", devs: 1, eff: 1 });
  calcRender();
  recompute();
}
function resetUR() {
  calcRows = JSON.parse(JSON.stringify(EXAMPLE));
  ["bufPct","wkSalary","minMargin","maxMargin"].forEach((id, idx) => {
    const v = [30, 250, 10, 30][idx];
    const el = document.getElementById(id); if (el) el.value = v;
  });
  calcRender();
  recompute();
}
function recompute() {
  const buf = parseFloat(document.getElementById("bufPct")?.value) || 0;
  const sal = parseFloat(document.getElementById("wkSalary")?.value) || 0;
  const minM = parseFloat(document.getElementById("minMargin")?.value) || 0;
  const maxM = parseFloat(document.getElementById("maxMargin")?.value) || 0;
  const avgDev = calcRows.length ? calcRows.reduce((s, r) => s + (r.devs||0), 0) / calcRows.length : 0;
  const avgEff = calcRows.length ? calcRows.reduce((s, r) => s + (r.eff||0), 0) / calcRows.length : 0;
  const tot = calcRows.reduce((s, r) => s + (r.devs||0) * (r.eff||0), 0);
  const sched = tot * (1 + buf / 100);
  const cost = sched * sal;
  const minP = cost * (1 + minM / 100);
  const maxP = cost * (1 + maxM / 100);
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.innerHTML = val; };
  set("outAvgDev", avgDev.toFixed(1));
  set("outAvgEff", avgEff.toFixed(1) + '<span class="unit">pw</span>');
  set("outTotEff", tot.toFixed(1) + '<span class="unit">pw</span>');
  set("outSched", sched.toFixed(1) + '<span class="unit">weeks</span>');
  const fmt = v => v.toLocaleString(undefined, { maximumFractionDigits: 0 });
  const cEl = document.getElementById("outCost"); if (cEl) cEl.textContent = fmt(cost);
  const minEl = document.getElementById("outMinPrice"); if (minEl) minEl.textContent = fmt(minP);
  const maxEl = document.getElementById("outMaxPrice"); if (maxEl) maxEl.textContent = fmt(maxP);
  // refresh table totals
  document.querySelectorAll(".calc-table .totalcol").forEach((c, i) => {
    if (calcRows[i]) c.value = ((calcRows[i].devs||0) * (calcRows[i].eff||0)).toFixed(1);
  });
}

renderProgress();
renderStep();
</script>
